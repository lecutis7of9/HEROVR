# Private 0.0.79.1 preview; never creates or edits a public release.
name: HERO VR 79.1 Dynamic Body preview
on:
  push:
    branches:
      - feature/0791-dynamic-leg-animation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-body:
    if: github.repository == 'lecutis7of9/HEROVR'
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the experimental branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python diagnostics and Windows folder safeguards
        run: |
          $env:PYTHONPATH = 'tools'
          python -B -m unittest -v test_compare_sandman_render test_windows_fault
          if ($LASTEXITCODE) { throw 'Python diagnostics regressions failed' }
          python -B tests/player_check_tests.py
          if ($LASTEXITCODE) { throw 'Windows folder preflight regressions failed' }
      - name: Fetch native build dependencies
        run: |
          ./tools/bootstrap.ps1 -Observer
          if ($LASTEXITCODE) { throw "Bootstrap failed ($LASTEXITCODE)" }
      - name: Compile all native modules and run C++ tests
        env:
          SPIDY_BHAPTICS_APP_ID: ${{ secrets.SPIDY_BHAPTICS_APP_ID }}
          SPIDY_BHAPTICS_API_KEY: ${{ secrets.SPIDY_BHAPTICS_API_KEY }}
        run: |
          Remove-Item Env:SM2VR_LAUNCHER -ErrorAction SilentlyContinue
          ./tools/build.ps1 -Observer -FromSource
          if ($LASTEXITCODE) { throw "Build/tests failed ($LASTEXITCODE)" }
      - name: Preserve Original 0.0.79 renderer, patch Revamped only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path previous -Force | Out-Null
          gh release download v0.0.79 --pattern 'HERO-VR-0.0.79-mod-win64.zip' --pattern 'HERO-VR-0.0.79-mod-win64.zip.sha256' --dir previous --clobber
          if ($LASTEXITCODE) { throw 'Could not download official 0.0.79 mod' }
          $zip = 'previous/HERO-VR-0.0.79-mod-win64.zip'
          $checksum = 'previous/HERO-VR-0.0.79-mod-win64.zip.sha256'
          $wanted = [regex]::Match([IO.File]::ReadAllText((Resolve-Path $checksum)), '(?i)[0-9a-f]{64}').Value
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($wanted.Length -ne 64 -or $wanted.ToLowerInvariant() -ne $actual.ToLowerInvariant()) { throw 'Official 0.0.79 ZIP SHA256 mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath previous/mod -Force
          $old = @(Get-ChildItem -LiteralPath previous/mod -Filter spidy_stereo_probe.dll -Recurse -File |
            Where-Object { $_.FullName -match 'renderer-modes[\\/]original[\\/]spidy_stereo_probe\.dll$' })
          if ($old.Count -ne 1) { throw "Expected one official Original DLL, got $($old.Count)" }
          $base = 'build/windows-ninja/renderer-modes'
          New-Item -ItemType Directory -Path "$base/original", "$base/revamped" -Force | Out-Null
          Copy-Item -LiteralPath $old[0].FullName -Destination "$base/original/spidy_stereo_probe.dll"
          Copy-Item -LiteralPath 'build/windows-ninja/spidy_stereo_probe.dll' -Destination "$base/revamped/spidy_stereo_probe.dll"
          $originalHash = (Get-FileHash "$base/original/spidy_stereo_probe.dll" -Algorithm SHA256).Hash
          $revampedHash = (Get-FileHash "$base/revamped/spidy_stereo_probe.dll" -Algorithm SHA256).Hash
          if ($originalHash -eq $revampedHash) { throw 'Distinct mode DLLs expected' }
          "Original: official unchanged 0.0.79; Revamped: Dynamic Body test" >> $env:GITHUB_STEP_SUMMARY
      - name: Package isolated test mod (never uploads to Releases)
        run: |
          $name = 'HERO-VR-79.1-TEST'
          ./tools/package.ps1 -Name $name
          if ($LASTEXITCODE) { throw "Packaging failed ($LASTEXITCODE)" }
          $zip = "dist/$name-win64.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "No mod test ZIP: $zip" }
          # GitHub artifacts arrive as an outer download folder, then the ZIP
          # extracts with another root folder. The Windows modules are staged
          # under reports/<kind>-modules/<full sha256>/<dll>. Check that a
          # realistic nested Downloads layout has ample MAX_PATH headroom.
          $sampleRoot = 'C:\Users\LongExampleUsername\Downloads\herovr-79-1-test\HERO-VR-79.1-TEST-win64\HERO-VR-79.1-TEST'
          $sampleDll = Join-Path $sampleRoot ('reports\render-memory-modules\' + ('a' * 64) + '\spidy_render_memory.dll')
          if ($sampleDll.Length -ge 230) { throw "Test ZIP nesting makes DLL staging too long: $($sampleDll.Length) chars" }
          "Sample nested staging path length: $($sampleDll.Length) chars" >> $env:GITHUB_STEP_SUMMARY
          python -B tools/check_bundled_python.py $zip --run
          if ($LASTEXITCODE) { throw 'Bundled Python check failed' }
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())  $name-win64.zip" |
            Set-Content "$zip.sha256" -NoNewline -Encoding ascii
          "Preview package: $zip" >> $env:GITHUB_STEP_SUMMARY
      - name: Attach test ZIP to this run (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: herovr-79-1-test
          path: |
            dist/HERO-VR-79.1-TEST-win64.zip
            dist/HERO-VR-79.1-TEST-win64.zip.sha256
          if-no-files-found: error
          retention-days: 14
