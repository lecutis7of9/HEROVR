name: FPS-only Windows build verification

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/078-fps-only

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
      - name: Build full VR mod and run project tests
        shell: pwsh
        run: |
          & .\tools\build.ps1 -FromSource -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'build\windows-ninja\spidy_stereo_probe.dll')) {
            throw 'Required VR module was not produced'
          }
      - name: Upload diagnostic Windows binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: herovr-078-fps-profiling-windows
          path: |
            build/windows-ninja/*.dll
            build/windows-ninja/*.exe
          if-no-files-found: error
          retention-days: 7
