name: HERO VR 0.0.80 public release - Classic and Performance
on:
  push:
    branches: [release/080-never]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release080:
    if: github.repository == 'lecutis7of9/HEROVR' && github.actor == github.repository_owner
    runs-on: windows-2022
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Skip when this is not the 0.0.80 tree
        id: gate
        run: |
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          if ($version -ne '0.0.80') {
            Write-Host "Not the 0.0.80 tree (VERSION=$version). Skipping."
            Add-Content -Path $env:GITHUB_OUTPUT -Value "skip=1" -Encoding ascii
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "skip=0" -Encoding ascii
          }
      - name: Python 3.12
        if: steps.gate.outputs.skip == '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release metadata and approved credits
        if: steps.gate.outputs.skip == '0'
        run: |
          if ((Get-Content VERSION -TotalCount 1).Trim() -ne '0.0.80') { throw 'Source version wrong' }
          if ((Get-Content PORT-VERSION -TotalCount 1).Trim() -ne 'Update 39.12') { throw 'Internal build wrong' }
          if (-not (Select-String -Path tools/launcher/src/ModVersion.cs -Pattern 'public const string Version = "0.0.80.1";' -SimpleMatch -Quiet)) { throw 'Launcher version wrong' }
          if (-not (Select-String -Path tools/launcher/src/ModVersion.cs -Pattern 'public const int Build = 23;' -SimpleMatch -Quiet)) { throw 'Launcher build wrong' }
          if (-not (Select-String -Path tools/launcher/src/ModVersion.cs -Pattern 'PreviousTag = "v0.0.79";' -SimpleMatch -Quiet)) { throw 'Previous tag wrong' }
          if (-not (Select-String -Path include/spidy/version.hpp -Pattern 'SPIDY_PUBLIC_VERSION "0.0.80"' -SimpleMatch -Quiet)) { throw 'Public version header wrong' }
          if (-not (Select-String -Path tools/launcher/src/RendererModes.cs -Pattern 'renderer-modes' -SimpleMatch -Quiet)) { throw 'Renderer selector missing' }
          if (-not (Select-String -Path tools/launcher/src/Cinematic.cs -Pattern 'Venom Cash, Gogeta and Tim The KoolAid Lover for testing' -SimpleMatch -Quiet)) { throw 'Tester credits missing' }
          if ($env:HEROVR_BUILD_FOOTER) { throw 'Public 0.0.80 must not set HEROVR_BUILD_FOOTER' }
          if ($env:HERO_TEST_BUILD) { throw 'Public 0.0.80 must not set HERO_TEST_BUILD' }
      - name: Download SHA256-verified official 0.0.79 baseline
        if: steps.gate.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path previous -Force | Out-Null
          gh release download v0.0.79 --pattern 'HERO-VR-Launcher-0.0.79.zip' --pattern 'HERO-VR-Launcher-0.0.79.zip.sha256' --pattern 'version.json' --dir previous --clobber
          if ($LASTEXITCODE) { throw 'Official previous release download failed' }
          $checkfile = Join-Path previous 'HERO-VR-Launcher-0.0.79.zip.sha256'
          $want = [regex]::Match([IO.File]::ReadAllText((Resolve-Path $checkfile)), '(?i)[0-9a-f]{64}').Value
          $got = (Get-FileHash (Join-Path previous 'HERO-VR-Launcher-0.0.79.zip') -Algorithm SHA256).Hash
          if ($want.Length -ne 64 -or $want.ToLowerInvariant() -ne $got.ToLowerInvariant()) { throw 'Previous launcher ZIP checksum mismatch' }
      - name: Download native dependencies
        if: steps.gate.outputs.skip == '0'
        run: |
          & ./tools/bootstrap.ps1 -Observer
          if ($LASTEXITCODE) { throw "Bootstrap error $LASTEXITCODE" }
      - name: Compile native gameplay and run C++ tests
        if: steps.gate.outputs.skip == '0'
        run: |
          # Public footer: do not set HEROVR_BUILD_FOOTER or HERO_TEST_BUILD.
          & ./tools/build.ps1 -Observer -FromSource
          if ($LASTEXITCODE) { throw "Native build error $LASTEXITCODE" }
          if (-not (Test-Path build/windows-ninja/spidy_stereo_probe.dll)) { throw 'Missing compiled renderer' }
      - name: Stage Classic and Performance from the same compiled DLL
        if: steps.gate.outputs.skip == '0'
        run: |
          $dll = 'build/windows-ninja/spidy_stereo_probe.dll'
          foreach ($mode in @('original','revamped')) {
            New-Item -ItemType Directory -Path "build/windows-ninja/renderer-modes/$mode" -Force | Out-Null
            Copy-Item $dll "build/windows-ninja/renderer-modes/$mode/spidy_stereo_probe.dll" -Force
          }
          $a = (Get-FileHash $dll -Algorithm SHA256).Hash
          $r = (Get-FileHash build/windows-ninja/renderer-modes/revamped/spidy_stereo_probe.dll -Algorithm SHA256).Hash
          $o = (Get-FileHash build/windows-ninja/renderer-modes/original/spidy_stereo_probe.dll -Algorithm SHA256).Hash
          if ($a -ne $r -or $o -ne $r) { throw "0.0.80 Classic and Performance must use the same compiled DLL (default=$a original=$o revamped=$r)" }
          Write-Host "Classic and Performance DLL SHA256: $r"
      - name: Compile public C# launcher and check .NET support
        if: steps.gate.outputs.skip == '0'
        run: |
          $ws = $env:GITHUB_WORKSPACE
          & "$ws/tools/launcher/build.ps1" -Out "$ws/out/ci/SM2VRLauncher.exe"
          Set-Location $ws
          if (-not (Test-Path "$ws/out/ci/SM2VRLauncher.exe")) { throw 'Launcher compilation failed' }
          # package.ps1 (79.1+) packs tools/launcher/SM2VRLauncher.exe into the mod zip.
          New-Item -ItemType Directory -Force -Path "$ws/tools/launcher" | Out-Null
          Copy-Item -LiteralPath "$ws/out/ci/SM2VRLauncher.exe" -Destination "$ws/tools/launcher/SM2VRLauncher.exe" -Force
          python -B "$ws/tools/launcher/tools/check-netfx.py" "$ws/tools/launcher/src"
          if ($LASTEXITCODE) { throw 'Launcher framework check failed' }
      - name: Package mod files with bundled Python and both renderers
        if: steps.gate.outputs.skip == '0'
        run: |
          & ./tools/package.ps1 -Name 'HERO-VR-0.0.80-mod'
          if ($LASTEXITCODE -or -not (Test-Path dist/HERO-VR-0.0.80-mod-win64.zip)) { throw 'Mod packaging failed' }
          python -B tools/check_bundled_python.py dist/HERO-VR-0.0.80-mod-win64.zip --run
          if ($LASTEXITCODE) { throw 'Bundled Python check failed' }
      - name: Build full public player ZIP and manifest
        if: steps.gate.outputs.skip == '0'
        run: |
          python -B tools/release080/build_release.py --previous previous/HERO-VR-Launcher-0.0.79.zip --mod dist/HERO-VR-0.0.80-mod-win64.zip --launcher out/ci/SM2VRLauncher.exe --old-manifest previous/version.json --out dist
          if ($LASTEXITCODE) { throw 'Full archive build failed' }
          $m = Get-Content dist/version.json -Raw | ConvertFrom-Json
          if ($m.version_number -ne '0.0.80' -or $m.launcher_build -ne 23) { throw 'Wrong manifest version' }
          if (@($m.files).Count -ne 2) { throw 'Manifest must contain 2 full downloads' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($path in @('dist/HERO-VR-0.0.80-mod-win64.zip','dist/HERO-VR-Launcher-0.0.80.zip')) {
            $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
            try {
              $names = @($z.Entries | ForEach-Object FullName)
              foreach ($mode in @('original','revamped')) {
                if (-not ($names | Where-Object { $_ -like "*/build/windows-ninja/renderer-modes/$mode/spidy_stereo_probe.dll" })) {
                  throw "$path does not include the $mode renderer"
                }
              }
            } finally { $z.Dispose() }
          }
          Copy-Item RELEASE-NOTES-v0.0.80.md dist/RELEASE-NOTES-v0.0.80.md
      - name: Keep candidate files even when not yet published
        if: steps.gate.outputs.skip == '0'
        uses: actions/upload-artifact@v4
        with:
          name: HERO-VR-0.0.80-release-candidate
          path: |
            dist/HERO-VR-Launcher-0.0.80.zip
            dist/HERO-VR-0.0.80-mod-win64.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
            dist/version.json
            dist/RELEASE-NOTES-v0.0.80.md
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete v0.0.80 and mark latest (only on main)
        if: steps.gate.outputs.skip == '0' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:GITHUB_ACTOR -ne 'lecutis7of9') { throw 'Only repository owner can release' }
          gh release view v0.0.80 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refuse overwrite' }
          $assets = @(
            'dist/HERO-VR-Launcher-0.0.80.zip', 'dist/HERO-VR-0.0.80-mod-win64.zip',
            'dist/HERO-VR-Launcher-0.0.80.zip.sha256', 'dist/HERO-VR-0.0.80-mod-win64.zip.sha256',
            'dist/SHA256SUMS.txt', 'dist/version.json', 'dist/RELEASE-NOTES-v0.0.80.md'
          )
          gh release create v0.0.80 @assets --target "$env:GITHUB_SHA" --title 'HERO VR 0.0.80' --notes-file RELEASE-NOTES-v0.0.80.md --latest
          if ($LASTEXITCODE) { throw 'GitHub Release publication failed' }
          gh release view v0.0.80 --json tagName,url,assets
