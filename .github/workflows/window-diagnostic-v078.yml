name: HERO VR 0.0.78 window probe ZIP
on:
  push:
    branches:
      - diagnostics/window-visibility-v078-2026-11-07
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch dependencies
        shell: pwsh
        run: .\tools\bootstrap.ps1 -Observer
      - name: Compile VR modules and launcher
        shell: pwsh
        run: .\tools\build.ps1 -Observer -FromSource
      - name: Prepare portable diagnostic folder
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'HEROVR-Window-Diagnostic'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          robocopy . $dest /E /XD .git third_party .github /XF *.obj *.pdb | Out-Null
          $copyExit = $LASTEXITCODE
          if ($copyExit -gt 7) { throw "Copy failed: $copyExit" }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path (Join-Path $dest 'build\windows-ninja\spidy_stereo_probe.dll'))) { throw 'Missing compiled stereo probe DLL' }
          @'
          HEROVR WINDOW VISIBILITY TEST
          1. Extract the entire ZIP.
          2. Launch HEROVR using the usual launcher/script from this folder.
          3. Use the included HERO VR Launcher.cmd; 0.0.78 already contains the window probe.
          4. Reproduce distant window flicker and collect reports/window-probe-*.jsonl if generated.
          This is an experimental diagnostic build. Keep your regular release.
          '@ | Set-Content (Join-Path $dest 'WINDOW-TEST-README.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: HEROVR-v078-Window-Probe-Windows
          path: ${{ runner.temp }}/HEROVR-Window-Diagnostic/
          retention-days: 7
