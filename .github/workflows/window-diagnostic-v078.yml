name: HERO VR 0.0.78 window probe ZIP
on:
  push:
    branches:
      - diagnostics/window-visibility-v078-2026-11-07
  workflow_dispatch:
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch dependencies
        shell: pwsh
        run: .\tools\bootstrap.ps1 -Observer
      - name: Compile VR modules and launcher
        shell: pwsh
        run: .\tools\build.ps1 -Observer -FromSource
      - name: Prepare portable diagnostic folder
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'HEROVR-Window-Diagnostic'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          robocopy . $dest /E /XD .git third_party .github /XF *.obj *.pdb | Out-Null
          $copyExit = $LASTEXITCODE
          if ($copyExit -gt 7) { throw "Copy failed: $copyExit" }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path (Join-Path $dest 'build\windows-ninja\spidy_stereo_probe.dll'))) { throw 'Missing compiled stereo probe DLL' }
          @'
          HEROVR COMBINED DISTANT BUILDING / WINDOW DIAGNOSTIC (v0.0.78)
          1. Extract the entire ZIP and use HERO VR Launcher.cmd.
          2. In one continuous session, hold still looking at distant fuzzy buildings,
             move toward windows until they light up, then move away, then pan your head.
          3. Exit the game normally. Keep one continuous video if possible.
          4. Send reports/window-probe-*.jsonl plus any window-*.csv files
             located beside spidy_stereo_probe.dll (search the extracted folder).
          5. Do not change graphics settings during the run.
          CSV files contain sampled actor POINTERS, NOT confirmed window IDs or texture mips.
          A missing CSV means its hook did not emit a file; do not assume the test succeeded.
          No DebugView or environment variables required for the CSV files.
          This is an experimental diagnostic build. Keep your regular release.
          '@ | Set-Content (Join-Path $dest 'WINDOW-TEST-README.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: HEROVR-v078-Window-Probe-Windows
          path: ${{ runner.temp }}/HEROVR-Window-Diagnostic/
          retention-days: 7
